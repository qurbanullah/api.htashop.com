name: Deploy the API

# A push to main deploys the API to production. There is deliberately no test job
# here: release.sh runs pint and the suite on the machine you deploy from, and a
# second copy in CI only meant the deploy sat waiting on it.
#
# The consequence is worth stating plainly, because it is easy to forget:
# NOTHING between a push and production checks the code any more. release.sh runs
# the checks; `--skip-checks` pushes straight to a live deploy.
#
# The deploy model is Docker Swarm: this connects to the manager, hands deploy.sh
# to it over stdin, and that script updates the checkout, builds the image and
# rolls the service. The stack itself (networks, secrets, db, redis, typesense,
# haproxy) is deployed separately — see deploy/ and DEPLOYMENT.md.
#
# One-time setup, under Settings → Secrets and variables → Actions:
#
#   Secret   DEPLOY_HOST     server hostname or IP
#   Secret   DEPLOY_USER     the account that owns the checkout
#   Secret   DEPLOY_SSH_KEY  private key able to log in as that user
#   Secret   DEPLOY_PORT     optional; without it, the sshd port below is used
#   Variable DEPLOY_PATH     the API's directory on the server
#   Variable SMOKE_URL       optional; https://api.htashop.com/up is the useful one
#
# A Secret or a Variable will do for DEPLOY_PORT, DEPLOY_PATH and SMOKE_URL:
# none of them are sensitive, so a Variable is the natural home, but filing one
# in the other store is an easy mistake and there is no reason to fail on it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the API
    runs-on: ubuntu-latest
    environment: production

    # Never two at once, and never cancelled midway: the API is in maintenance
    # mode while this runs, and deploy.sh's trap has to reach the end.
    concurrency:
      group: deploy-api-production
      cancel-in-progress: false

    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      # A port number is not a secret — any scan reveals it, and access is still
      # gated on the key — so this is a working default rather than another
      # setting that can be missing or filed under the wrong name. DEPLOY_PORT
      # overrides it.
      SSH_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '52341' }}
      # Accepted as a Variable or as a Secret. Neither is sensitive, so a
      # Variable is the natural home, but filing one in the other store is an easy
      # mistake and there is no reason to fail over it.
      SERVER_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
      SMOKE_URL: ${{ vars.SMOKE_URL || secrets.SMOKE_URL }}
      # Reported by the configuration check, so an override that did not take
      # effect is visible rather than silently falling back to the default.
      DEPLOY_PORT_SET: ${{ (secrets.DEPLOY_PORT || vars.DEPLOY_PORT) && 'yes' || 'no' }}
      BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      # Fail with instructions rather than a cryptic error partway through.
      - name: Check configuration
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ]    || missing="$missing DEPLOY_HOST"
          [ -n "$SSH_USER" ]    || missing="$missing DEPLOY_USER"
          [ -n "$SSH_KEY" ]     || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$SERVER_PATH" ] || missing="$missing DEPLOY_PATH"

          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing"
            echo ""
            echo "Set these under Settings → Secrets and variables → Actions:"
            echo "  Secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, optional DEPLOY_PORT"
            echo "  Variables: DEPLOY_PATH, optional SMOKE_URL"
            echo ""
            echo "Either store works for any of them, but the name must match exactly,"
            echo "and the value must not be empty. Repository-level entries apply to"
            echo "every run; environment-level ones only to a job using that environment,"
            echo "which this one does via 'environment: production'."
            exit 1
          fi

          # Echoed because a wrong path is far easier to spot here than as a
          # failure twenty steps later. None of these are secrets.
          echo "Resolved configuration:"
          echo "  host: $SSH_HOST"
          echo "  user: $SSH_USER"
          echo "  path: $SERVER_PATH"

          if [ "$DEPLOY_PORT_SET" = "yes" ]; then
            echo "  port: $SSH_PORT  (from DEPLOY_PORT)"
          else
            echo "  port: $SSH_PORT  (built-in default; DEPLOY_PORT overrides it)"
          fi

      # The deploy scripts are the only code that runs with the API in
      # maintenance mode, and a syntax error in one would be found at the worst
      # possible moment. Seconds to check, so it is checked here.
      - name: Check the deploy scripts
        run: |
          bash -n deploy.sh release.sh
          shellcheck deploy.sh release.sh

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # A separate step so a connection problem is reported as one, with the
      # reason, rather than as a failure partway through the deploy. The host key
      # is trusted on first use by the ssh commands themselves
      # (StrictHostKeyChecking=accept-new); scanning it with ssh-keyscan was a
      # second way for the same connection to fail, silently.
      - name: Check SSH connection
        run: |
          if ! ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                 -o StrictHostKeyChecking=accept-new \
                 -o ConnectTimeout=15 \
                 -o BatchMode=yes \
                 "$SSH_USER@$SSH_HOST" "id -un; hostname"; then
            echo "::error::Cannot open an SSH session to $SSH_USER@$SSH_HOST on port $SSH_PORT"
            echo ""
            echo "Check, in this order:"
            echo "  1. DEPLOY_HOST resolves from the public internet."
            echo "  2. Port $SSH_PORT is the one sshd listens on, and is not firewalled."
            echo "     A hardened server often moves SSH off 22 — set DEPLOY_PORT."
            echo "  3. DEPLOY_SSH_KEY is the private half of a key listed in that"
            echo "     user's ~/.ssh/authorized_keys (the error above says which)."
            exit 1
          fi

      # deploy.sh arrives over stdin rather than being read from the server, so a
      # change to the deploy process takes effect on the deploy that introduces
      # it, instead of the one after.
      - name: Deploy
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$SERVER_PATH' && APP_DIR='$SERVER_PATH' BRANCH='$BRANCH' SMOKE_URL='$SMOKE_URL' bash -s" \
            < deploy.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "- branch: \`$BRANCH\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- checks: run locally by release.sh, not here"
            echo "- deploy.sh on the server: ${{ steps.deploy.outcome }}"
            echo "- result: **${{ job.status }}**"
            echo ""
            if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
              echo "The server's own output is in the failed \`Deploy\` step above."
              echo "deploy.sh prints a labelled line for each phase it reaches, so the"
              echo "last one shown is where it stopped."
            else
              echo "The failure was before the deploy ran — most likely the"
              echo "configuration check or the SSH connection above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
