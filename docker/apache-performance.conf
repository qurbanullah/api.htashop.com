# mpm_event configuration for high concurrency
<IfModule mpm_event_module>
    # PHP concurrency is capped by the php-fpm pool (pm.max_children = 6 in
    # docker/Dockerfile), not by Apache. Apache here is effectively a reverse
    # proxy, so 400 workers were pure memory overhead with no benefit.
    ServerLimit            8
    MaxRequestWorkers      100

    # Control server lifecycle
    StartServers           3
    MinSpareThreads        25
    MaxSpareThreads        75
    ThreadsPerChild        25

    # Performance tuning. Under mpm_event the directive is
    # MaxConnectionsPerChild; MaxRequestsPerChild is silently ignored.
    MaxConnectionsPerChild 1000

    # Connection handling
    ListenBacklog          511

    # Async processing
    AsyncRequestWorkerFactor 2
</IfModule>

# Security
ServerTokens Prod
ServerSignature Off

# Performance
HostnameLookups Off
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Compression (if mod_deflate available)
<IfModule mod_deflate.c>
    SetOutputFilter DEFLATE
    SetEnvIfNoCase Request_URI \
        \.(?:gif|jpe?g|png)$ no-gzip dont-vary
    SetEnvIfNoCase Request_URI \
        \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
</IfModule>
