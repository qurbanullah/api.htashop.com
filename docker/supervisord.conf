; Production API container — WEB ONLY.
;
; Queue workers and the scheduler are separate Swarm services (`worker` and
; `scheduler` in docker-swarm.yml), all from this same image. They must not run
; here: with N api replicas, the in-container scheduler would run N times and
; the workers would compete with php-fpm for the container's memory limit.
;
; The development image uses docker/supervisord.dev.conf, which still starts
; Apache, php-fpm, a queue worker and the scheduler in one container.

[unix_http_server]
file=/var/run/supervisor.sock   ; (the path to the socket file)

[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; use a unix:// URL  for a unix socket

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
directory=/var/www/html
; run apache as root under supervisord so it can create/own sockets if needed.
; Apache will drop privileges to its configured user for worker processes.
; Running supervisord itself as root is intentional so spawned services that
; require initial root actions (like creating sockets) can succeed.
directory=/var/www/html
; ensure apache starts after php-fpm is up
priority=20

[program:php8.4-fpm]
command=/usr/sbin/php-fpm8.4 --nodaemonize
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
; Run php-fpm as root under supervisord so it can chown the unix socket and
; open its configured error_log. The php-fpm pool config should still drop
; worker processes to the configured user (usually www-data).
; start php-fpm before apache to avoid proxy connection refusals during startup
priority=10
startsecs=5
