# Global Apache configuration
ServerName localhost

<VirtualHost *:20050>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Allow large file uploads (4GB)
    LimitRequestBody 4294967296

    <Directory "/var/www/html/public">
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # Use PHP-FPM for PHP files (unix socket)
        <FilesMatch \.php$>
            # Use the PHP-FPM unix socket for best performance and predictable
            # permissions in containerized environments. Ensure php-fpm pool
            # config sets listen.owner/listen.group/listen.mode accordingly.
            SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
        </FilesMatch>

        # Laravel pretty URLs
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php?/$1 [L]
        </IfModule>
    </Directory>

    # Security - Don't expose sensitive files
    <Files ".env">
        Require all denied
    </Files>

    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>

    # Cache static files
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/ico "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
    </IfModule>
</VirtualHost>
